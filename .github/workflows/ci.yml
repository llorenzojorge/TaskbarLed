name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore TaskbarLed.slnx

      - name: Build
        run: dotnet build TaskbarLed.slnx -c Release --no-restore

      - name: Test
        run: dotnet test TaskbarLed.slnx -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish app
        run: dotnet publish src/TaskbarLed.App -c Release -o artifacts/TaskbarLed

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarLed
          path: artifacts/TaskbarLed

  # macOS port (docs/PROPOSTAS.md, P4): everything except the WPF app and Platform.Windows.
  macos:
    runs-on: macos-latest
    env:
      TASKBARLED_SCREENSHOTS: ${{ github.workspace }}/artifacts/screenshots
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: |
          for project in tests/*.Tests; do
            dotnet test "$project" -c Release
          done

      # Packaging publishes both the app and hook for each architecture.
      - name: Package app (Apple Silicon)
        run: src/TaskbarLed.App.Avalonia/build-macos.sh

      - name: Package app (Intel)
        run: src/TaskbarLed.App.Avalonia/build-macos.sh osx-x64

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarLed-macos-screenshots
          path: artifacts/screenshots

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarLed-osx-arm64
          path: |
            artifacts/TaskbarLed-osx-arm64/TaskbarLed-osx-arm64.zip
            artifacts/TaskbarLed-osx-arm64/TaskbarLed-osx-arm64.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: TaskbarLed-osx-x64
          path: |
            artifacts/TaskbarLed-osx-x64/TaskbarLed-osx-x64.zip
            artifacts/TaskbarLed-osx-x64/TaskbarLed-osx-x64.pkg
