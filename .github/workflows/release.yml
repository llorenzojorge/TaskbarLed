name: Release

# Push a tag like v1.2.3 to build, test and publish TaskbarLed-win-x64.zip as a GitHub release.
# The tag is the version: v1.2.3 stamps 1.2.3 into the binaries.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      # Passed through the environment, never pasted into a script: a tag name is outside input.
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Tag '$env:TAG' is not vMAJOR.MINOR.PATCH." }
          "VERSION=$($Matches[1])" >> $env:GITHUB_ENV

      - name: Test
        run: dotnet test TaskbarLed.slnx -c Release

      - name: Publish
        shell: pwsh
        run: dotnet publish src/TaskbarLed.App -c Release -r win-x64 --self-contained false -p:Version=$env:VERSION -o artifacts/TaskbarLed

      - name: Zip and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/TaskbarLed/* -DestinationPath TaskbarLed-win-x64.zip
          $hash = (Get-FileHash TaskbarLed-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  TaskbarLed-win-x64.zip" | Out-File TaskbarLed-win-x64.zip.sha256 -Encoding ascii

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:TAG" TaskbarLed-win-x64.zip TaskbarLed-win-x64.zip.sha256 --title "TaskbarLed $env:TAG" --generate-notes

  release-macos:
    needs: release
    runs-on: macos-latest
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test and package
        shell: bash
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          export TASKBARLED_VERSION="${TAG#v}"
          for project in tests/*.Tests; do
            dotnet test "$project" -c Release
          done
          for rid in osx-arm64 osx-x64; do
            src/TaskbarLed.App.Avalonia/build-macos.sh "$rid"
          done

      - name: Upload Mac installers and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          for rid in osx-arm64 osx-x64; do
            dir="artifacts/TaskbarLed-$rid"
            for ext in zip pkg; do
              name="TaskbarLed-$rid.$ext"
              (cd "$dir" && shasum -a 256 "$name" > "$name.sha256")
              files+=("$dir/$name" "$dir/$name.sha256")
            done
          done
          gh release upload "$TAG" "${files[@]}"
